{% extends "base.html" %}

        <p>Access token value: <span class="label label-danger">{{ access_token or "NONE" }}</span></p>
        <p>Scope value: <span class="label label-danger">{{ scope or "NONE" }}</span></p>

        <a class="btn btn-default" href="/words">Access the Words API</a>
      </div>
{% endblock %}
