  <text x="564" y="476" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#9DA7B3">that grow chapter by chapter.</text>
  <text x="564" y="566" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#6E7681">github.com/zuhaib786/oauth2-in-action-rust</text>
