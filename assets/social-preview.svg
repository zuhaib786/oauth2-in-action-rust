  </g>
  <text x="560" y="280" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-1" fill="#E6EDF3">OAuth 2 in Action</text>
  <text x="564" y="336" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="9" fill="#F2783A">RUST EDITION</text>
  <text x="564" y="404" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#9DA7B3">The book's exercises, rebuilt in Rust as one client,</text>
