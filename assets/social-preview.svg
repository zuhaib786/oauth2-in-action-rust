      <rect x="-6.5" y="-38" width="13" height="16" rx="2.5" transform="rotate(180)"/>
      <rect x="-6.5" y="-38" width="13" height="16" rx="2.5" transform="rotate(225)"/>
      <rect x="-6.5" y="-38" width="13" height="16" rx="2.5" transform="rotate(270)"/>
