# Cargo workspace: the three OAuth programs plus a small shared helper crate.
# All crates share a single `target/` dir, so dependencies compile only once.
[workspace]
resolver = "2"
members = ["common", "client", "authorization-server", "protected-resource", "word-bot", "acceptance"]

[workspace.dependencies]
oauth-common = { path = "common" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "2", features = ["loader", "json"] }
tower-http = { version = "0.6", features = ["cors"] }
url = "2"
rand = "0.9"
base64 = "0.22"
urlencoding = "2"
argon2 = "0.5"

# Argon2 is slow on purpose, and painfully slow without optimizations.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
